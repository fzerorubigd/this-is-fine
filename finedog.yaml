substitutions:
  devicename: finedog
  friendly_name: This is fine dog
  time_zone: UTC
  # Entity prefix of the printer in Home Assistant (Bambu Lab integration).
  printer: sensor.p2s_xxxxxxxxxxxxxxx

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 40000000L
    board_build.flash_size: 4MB

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino
    version: recommended

safe_mode:

logger:
  level: INFO

ota:
  - platform: esphome
    # Uses the api encryption key.
    encryption:
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Lets the device be reached as ${devicename}.lan when .local does not resolve.
  domain: ".lan"
  fast_connect: true
  ap:
    ap_timeout: 1min
    ssid: "${friendly_name} AP"
    password: !secret wifi_ap_password
  on_connect:
    - output.turn_off: embeded_led
  on_disconnect:
    - output.turn_on: embeded_led

captive_portal:

web_server:
  port: 80
  include_internal: false
  version: 3
  log: true

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 120s
  - platform: homeassistant
    id: print_progress
    name: "Progress"
    entity_id: ${printer}_print_progress
  - platform: homeassistant
    id: print_time_remaining
    name: "Remaining Time"
    entity_id: ${printer}_remaining_time

text_sensor:
  - platform: homeassistant
    id: print_stage
    name: Current State
    entity_id: ${printer}_current_stage
  # The stage changes many times during a job (bed leveling, nozzle cleaning,
  # filament changes...); the status stays "running" for the whole print.
  - platform: homeassistant
    id: print_status
    name: Print Status
    entity_id: ${printer}_print_status
  - platform: version
    name: ESPHome Version
    hide_timestamp: true
  - platform: wifi_info
    ip_address:
      name: IP
      id: ip_address_text
      icon: mdi:ip-network
    ssid:
      name: SSID
      icon: mdi:wifi
    mac_address:
      name: MAC
      icon: mdi:identifier
  - platform: template
    name: Friendly Name
    icon: 'mdi:information-outline'
    lambda: |-
      return {"$devicename"};
  - platform: template
    name: Fine Count
    icon: mdi:fire
    lambda: |-
      return to_string(id(button_pressed));

output:
  - platform: ledc
    pin: GPIO8
    id: embeded_led
    inverted: true
  - platform: gpio
    pin: GPIO2
    id: thedog_switch

button:
  - platform: output
    name: "Trigger The Dog"
    output: thedog_switch
    id: trigger_the_dog
    duration: 300ms
    icon: "mdi:fire"
    on_press:
      - lambda: 'id(button_pressed) += 1;'
      - logger.log: "This is fine!"
      - display.page.show: fire
      - delay: 12s
      - display.page.show: watch

image:
  - platform: file
    file: mdi:fire
    id: fire_small
    type: BINARY
    resize: 20x20
  - platform: file
    file: mdi:fire
    id: fire_mid
    type: BINARY
    resize: 30x30
  - platform: file
    file: mdi:fire
    id: fire_large
    type: BINARY
    resize: 40x40
  - platform: file
    file: mdi:printer-3d-nozzle
    id: print_on
    type: BINARY
    resize: 20x20
  - platform: file
    file: mdi:printer-3d-nozzle-off
    id: print_off
    type: BINARY
    resize: 20x20

font:
  - file: "gfonts://Ubuntu"
    id: font_large
    size: 32
  - file: "gfonts://Ubuntu"
    id: font_normal
    size: 13
  - file: "gfonts://Ubuntu"
    id: font_small
    size: 8

time:
  - platform: sntp
    id: sntp_time
    timezone: ${time_zone}
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org

globals:
  - id: button_pressed
    type: int
    restore_value: no
    initial_value: '0'

i2c:
  sda: GPIO21
  scl: GPIO20

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: my_display
    show_test_card: false
    pages:
      - id: watch
        lambda: |-
          char str[20];
          time_t currTime = id(sntp_time).now().timestamp;
          strftime(str, sizeof(str), "%H:%M", localtime(&currTime));
          auto sec = int(currTime)%60;
          it.filled_rectangle(4, 0, 4+sec*2, 10,  COLOR_ON);
          int top = 11;
          int width;
          int x_offset;
          int	baseline;
          int	height;
          id(font_large).measure(str, &width, &x_offset, &baseline, &height);
          it.print((it.get_width()-width)/2 , top, id(font_large), str);
          top += height + 1;
          auto ip = id(ip_address_text).state.c_str();
          auto state = id(print_status).state;
          if (state == "running" || state == "pause"){
            auto remaining = (int) (id(print_time_remaining).get_state() * 60);
            auto perc = (int) id(print_progress).get_state();
            std::string status = to_string(remaining)+"m  ("+to_string(perc)+"%)";
            id(font_normal).measure(status.c_str(), &width, &x_offset, &baseline, &height);
            it.print((it.get_width()-width)/2 , it.get_height() - height, id(font_normal), status.c_str());
            it.filled_rectangle(4, it.get_height() - height - 3, 3+perc, 1,  COLOR_ON);
            it.image(5+perc, 28, id(print_on));
          } else {
            it.image(2, 20, id(print_off));
            strftime(str, sizeof(str), "%a, %b %d, %Y", localtime(&currTime));
            id(font_normal).measure(str, &width, &x_offset, &baseline, &height);
            it.print((it.get_width()-width)/2 , it.get_height() - height, id(font_normal), str);
          }
          if (id(button_pressed) == 0) {
            id(font_small).measure(ip, &width, &x_offset, &baseline, &height);
            it.print((it.get_width()-width)/2 , 2, id(font_small), ip);
          }
      - id: fire
        lambda: |-
          time_t currTime = id(sntp_time).now().timestamp;
          auto sec = int(currTime)%2==0 ? -5: 0;
          it.image(it.get_width()/2, it.get_height()/2-4+sec, id(fire_large));
          it.image(it.get_width()/3, it.get_height()/2-19-sec, id(fire_mid));
          it.image(it.get_width()*2/3, it.get_height()/2-9+sec, id(fire_small));
          it.image(5, it.get_height()/2-4+sec, id(fire_large));
          it.print(4 , 2, id(font_small), to_string(id(button_pressed)).c_str());

api:
  port: 6053
  encryption:
    key: !secret encryption_key
  reboot_timeout: 0s
